[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pip-tools]
# Packages conda installs (numpy for the graph-tool ABI; scipy, cffi and pycparser with
# graph-tool) must stay out of the pip lock, else pip replaces them and conda-pack ships a
# broken mixed install. Listing any unsafe-package resets pip-tools' defaults, so setuptools
# and pip are repeated to keep them excluded too.
unsafe-package = ["numpy", "scipy", "cffi", "pycparser", "setuptools", "pip"]

[tool.pytest.ini_options]
testpaths = ["pychunkedgraph/tests"]
