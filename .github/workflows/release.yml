# Release workflow for PyChunkedGraph with automatic helm chart updates
name: publish release

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Semver part to bump (major, minor, patch)"
        type: choice
        required: true
        default: "patch"
        options: ["major", "minor", "patch"]
      dry-run:
        description: "Dry run"
        type: boolean
        required: true
        default: false
      skip-tests:
        description: "Skip tests"
        type: boolean
        required: true
        default: false
      update-chart:
        description: "Also bump the pychunkedgraph Helm chart appVersion (needs HELM_CHART_UPDATE_TOKEN)"
        type: boolean
        required: false
        default: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      VERSION: ${{ steps.get-version.outputs.VERSION }}
      SHORT_VERSION: ${{ steps.get-version.outputs.SHORT_VERSION }}
      MAJOR_VERSION: ${{ steps.get-version.outputs.MAJOR_VERSION }}
      MINOR_VERSION: ${{ steps.get-version.outputs.MINOR_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure git for github-actions[bot]
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version in pychunkedgraph/_version.py
        id: get-version
        run: |
          cur=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pychunkedgraph/_version.py)
          IFS=. read -r major minor patch <<< "$cur"
          case "${{ github.event.inputs.part }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" pychunkedgraph/_version.py
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "MAJOR_VERSION=$major" >> $GITHUB_OUTPUT
          echo "MINOR_VERSION=$minor" >> $GITHUB_OUTPUT
          echo "SHORT_VERSION=$major.$minor" >> $GITHUB_OUTPUT
      - name: Commit the bump and push the tag
        if: ${{ github.event.inputs.dry-run == 'false' }}
        run: |
          git add pychunkedgraph/_version.py
          git commit -m "release v${{ steps.get-version.outputs.VERSION }}"
          git tag "v${{ steps.get-version.outputs.VERSION }}"
          git push origin HEAD
          git push origin "v${{ steps.get-version.outputs.VERSION }}"
      - name: Show short version
        run: echo ${{ steps.get-version.outputs.SHORT_VERSION }}
      
      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.VERSION }}
          name: Release v${{ steps.get-version.outputs.VERSION }}
          body: |
            ## PyChunkedGraph v${{ steps.get-version.outputs.VERSION }}
            
            This release was automatically generated by the release workflow.
            
            ### Changes
            - Version bumped from previous release
            
            See commit history for detailed changes.
          draft: false
          prerelease: false
          
  update-chart:
    name: Update pychunkedgraph Helm chart
    runs-on: ubuntu-latest
    needs: bump
    if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.update-chart == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout PyChunkedGraph repo
        uses: actions/checkout@v4
        
      - name: Checkout cave-helm-charts repo
        uses: actions/checkout@v4
        with:
          repository: CAVEconnectome/cave-helm-charts
          token: ${{ secrets.HELM_CHART_UPDATE_TOKEN }}
          path: helm-charts
          
      - name: Update Chart.yaml appVersion
        id: update-chart
        run: |
          cd helm-charts
          chart_file="charts/pychunkedgraph/Chart.yaml"
          
          # Get current chart version
          current_chart_version=$(grep '^version:' $chart_file | cut -d' ' -f2)
          echo "Current chart version: $current_chart_version"
          
          # Update appVersion
          sed -i "s/^appVersion: .*/appVersion: \"${{ needs.bump.outputs.VERSION }}\"/" $chart_file
          
          # Bump chart patch version
          new_chart_version=$(echo $current_chart_version | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          sed -i "s/^version: .*/version: $new_chart_version/" $chart_file
          
          echo "Updated to chart version: $new_chart_version"
          echo "Updated to app version: ${{ needs.bump.outputs.VERSION }}"
          echo "CHART_VERSION=$new_chart_version" >> $GITHUB_OUTPUT
          
      - name: Commit and push changes
        run: |
          cd helm-charts
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add charts/pychunkedgraph/Chart.yaml
          git commit -m "Update pychunkedgraph to v${{ needs.bump.outputs.VERSION }}

          - Update appVersion to ${{ needs.bump.outputs.VERSION }}
          - Bump chart version to ${{ steps.update-chart.outputs.CHART_VERSION }}

          Auto-generated by PyChunkedGraph release workflow"
          git push