name: pychunkedgraph
channels:
  - conda-forge
  # never resolve against Anaconda's `defaults`: its channels are the only ones
  # gated on a terms-of-service acceptance, and the plugin serving that gate
  # breaks whenever conda itself is updated from conda-forge.
  - nodefaults
dependencies:
  - python==3.11.4
  - pip
  - uwsgi==2.0.21
  - graph-tool-base==2.58
  - zstandard==0.19.0  # ugly hack to force PyPi install 0.21.0
  - pip:
    - -r requirements.txt
    - -r requirements-dev.txt